<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trilhas - Circuito Terê Verde</title>
<link rel="stylesheet" href="css/style.css" />
<script defer src="js/main.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <h1>Circuito Terê Verde</h1>
      <p class="subtitle">Teresópolis — Ecoturismo &amp; Biodiversidade</p>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Início</a>
      <a href="trilhas.html" class="nav-link ativo">Trilhas</a>
      <a href="biodiversidade.html" class="nav-link">Biodiversidade &amp; Eventos</a>
      <button id="openLogin" class="btn login-btn">Login Admin</button>
    </nav>
  </div>
</header>

<main class="container">
  <section class="section">
    <h3>Trilhas disponíveis</h3>
    <p class="muted">Disponibilidade e horários são atualizados pela administração do parque.</p>
    <div id="listaTrilhas"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">© 2026 Circuito Terê Verde — Projeto acadêmico</div>
</footer>

<div id="loginModal" class="modal" aria-hidden="true">
  <div class="modal-panel">
    <button id="closeLogin" class="modal-close" aria-label="Fechar">&times;</button>
    <h3>Acesso Administrativo</h3>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" />
    <div class="modal-actions">
      <button id="loginBtn" class="btn primary">Entrar</button>
      <button id="cancelLogin" class="btn ghost">Cancelar</button>
    </div>
    <p id="loginMsg" class="erro"></p>
  </div>
</div>
</body>
</html>
